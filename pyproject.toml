[project]
name = "coverlens"
version = "0.1.0"
description = "Measures whether a test suite covers the requirements of a new feature and reports the gaps."
readme = "README.md"
authors = [
    { name = "phuoctmse", email = "phuoctmse184067@fpt.edu.vn" }
]
requires-python = ">=3.14.3"
dependencies = [
    "allpairspy>=2.5.1",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.scripts]
coverlens = "coverlens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import the top-level eval package