# Domain pack for the OTT web player (fictional "Streamly" service).
# Everything domain-specific lives here; src/coverlens/core/ stays generic.

name: ott_web

suite:
  sheet: Test cases
  columns:              # Case field -> suite header
    id: Test ID
    title: Title
    preconditions: Preconditions
    steps: Steps
    expected_result: Expected result
    refs: Requirement ref
    tags: Tags
  dimensions:           # columns describing the environment a case runs in
    - Browser
    - Protocol / DRM
    - Region
    - User state
    - Content type
    - Player state
    - Network
  list_separator: ","

# Suite tag -> story. Tags only add candidates; they are never evidence of coverage.
tag_map:
  account: US-01
  catalogue: US-02
  playback: US-03
  live: US-04
  controls: US-05
  quality: US-06
  tracks: US-07
  entitlement: US-08
  region: US-09
  limits: US-10
  resilience: US-11
  drm: US-12
  progress: US-13

# Tier 1 (BM25 over case title + steps + expected result). Measured on this
# dataset on 2026-10-02:
#   - lowest top score of any covered requirement: 9.50, so gap_threshold stays
#     below it even before the "no ref" rule applies (catches 1 of 9 gaps);
#   - orphan cases score 7.64-8.39 against their best requirement, the lowest
#     non-orphan without ref or tag scores 11.23.
# Retrieval recall@3 was 43/43 covered requirements, so top_k 5 leaves margin.
tier1:
  top_k: 5
  gap_threshold: 9.0
  orphan_threshold: 10.0

# Phrase -> canonical term, applied to spec and suite text before matching.
# The spec says "on demand" where the suite says "VOD".
glossary:
  on demand: vod
  video on demand: vod

# Pairwise coverage: every value each dimension can take, and the combinations
# that cannot occur. Constraints come from the spec (US-12: which DRM each
# browser uses). Values are written exactly as in the suite.
pairwise:
  values:
    Browser: [Chrome, Firefox, Safari, Edge, Other browser]
    Protocol / DRM: [DASH+Widevine, HLS+FairPlay, DASH+PlayReady, None]
    Region: [In region, Out of region]
    User state: [Plan active, "Signed in, no plan", Signed out]
    Content type: [VOD, Live]
    Player state: [Loading, Playing, Paused, Buffering, Seeking, Ended]
    Network: [Good, Slow, Unstable, Offline mid-play]
  constraints:
    - if: {Browser: Chrome}
      then: {Protocol / DRM: [DASH+Widevine]}
    - if: {Browser: Firefox}
      then: {Protocol / DRM: [DASH+Widevine]}
    - if: {Browser: Safari}
      then: {Protocol / DRM: [HLS+FairPlay]}
    - if: {Browser: Edge}
      then: {Protocol / DRM: [DASH+PlayReady]}
    - if: {Browser: Other browser}
      then: {Protocol / DRM: ["None"]}

# Words that must never appear in src/coverlens/core/ (enforced by a contract test).
# Generic English words that core may legitimately use (live, edge, stream) are left out.
forbidden_core_terms:
  - browser
  - chrome
  - firefox
  - safari
  - drm
  - widevine
  - fairplay
  - playready
  - hls
  - region
  - entitlement
  - subscription
  - playback
  - subtitle
  - vod
  - ott
